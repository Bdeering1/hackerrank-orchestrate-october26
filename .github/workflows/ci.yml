name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: code
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Lockfile
        run: uv lock --check
      - name: Install
        id: install
        if: ${{ !cancelled() }}
        run: uv sync --frozen
      - name: Ruff check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: uv run --frozen ruff check .
      - name: Ruff format
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: uv run --frozen ruff format --check .
      - name: Basedpyright
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: uv run --frozen basedpyright
      - name: Pytest
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: uv run --frozen pytest
      - name: Import layers
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: uv run --frozen lint-imports
      - name: Zizmor
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: uv run --frozen zizmor --persona=auditor --min-severity=low ../.github
      - name: Gitleaks
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --verbose --log-opts="$BASE_SHA..HEAD" ..
